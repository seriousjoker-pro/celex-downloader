[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "celex-downloader"
version = "0.1.0"
description = "Official English CELEX HTML/XHTML, PDF and XML downloader"
requires-python = ">=3.11"

[project.scripts]
celex-download = "celex_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
